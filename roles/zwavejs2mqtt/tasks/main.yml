---
# tasks file for zwavejs2mqtt
- name: Include OS-specific variables.
  include_vars: "{{ lookup('first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_network_os | default(none) }}.yml"
        - "{{ ansible_distribution | lower }}.yml"
        - "{{ ansible_distribution.split(' ')[0] | lower }}.yml"
        - "{{ ansible_os_family | lower }}_family.yml"
        - "{{ ansible_system | lower }}.yml"
        - main.yml
      paths:
        - "vars"
  become: no
  tags:
    - upgrade

- name: "Install packages"
  ansible.builtin.package:
    name: "{{ hearthminion_packages }}"
    state: present
  become: yes
  tags:
    - install-packages
    - upgrade

- name: "Check if we need the websocket port enabled."
  ansible.builtin.set_fact:
    __zwavejs2mqtt_exposed_ports: "{{ __zwavejs2mqtt_exposed_ports }} + [ {{ __zwavejs2mqtt_ws_port }}:{{ __zwavejs2mqtt_ws_port }} ]"
  become: no
  when:
    - zwavejs2mqtt_ws_enabled
  tags:
    - upgrade

- name: "Check if we are upgrading zwavejs2mqtt."
  ansible.builtin.set_fact:
    __zwavejs2mqtt_upgrade: yes
  become: no
  tags:
    - never
    - upgrade
    - upgrade-zwavejs2mqtt
    - upgrade-zwave

# TODO: Add check for storage folder existance before running docker command.

- name: "Install zwave-js-ui Docker Container."
  community.docker.docker_container:
    name: "zwave-js-ui"
    image: "zwavejs/zwave-js-ui:latest"
    auto_remove: false
    container_default_behavior: "no_defaults"
    detach: true
    devices: "{{ zwavejs2mqtt_devices }}"
    exposed_ports: "{{ __zwavejs2mqtt_exposed_ports }}"
    init: true
    interactive: true
    memory: "0"
    mounts:
      - type: "bind"
        source: "{{ zwavejs2mqtt_config_dir }}"
        target: "/usr/src/app/store"
    network_mode: "host"
    paused: no
    privileged: no
    pull: "{{ __zwavejs2mqtt_upgrade }}"
    read_only: false
    recreate: false
    restart: false
    restart_policy: "unless-stopped"
    state: "present"
    stop_signal: "SIGINT"
    tty: true
  become: true
  tags:
    - upgrade

# ==================================================================================================
#
# This needs another way of checking and disabling.
#
# Two sites cannot both have "default_server" set.  So what really needs to happen is a way to check
# if another site has that value set.  If so, we need to not enable "default_server" in this
# configuration file.
#
# Current workaround is to install our site, and remove "default" site from the enabled servers.
#
# This will break setups where "default" site is another website on the host that is in use.
#
# ==================================================================================================
- name: "Install Nginx virtual host config file."
  ansible.builtin.template:
    src: "nginx-site.conf.j2"
    dest: "/etc/nginx/sites-available/{{ inventory_hostname }}.conf"
    owner: root
    group: root
    mode: "0644"
  become: yes
  notify: reload nginx
  tags:
    - upgrade

- name: "Enable nginx site."
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ inventory_hostname }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ inventory_hostname }}.conf"
    owner: root
    group: root
    state: "link"
  become: yes
  notify: reload nginx
  tags:
    - upgrade

- name: "Install ssl snippets"
  ansible.builtin.template:
    src: "ssl-snippets.conf.j2"
    dest: "/etc/nginx/snippets/{{ inventory_hostname }}.conf"
    owner: root
    group: root
    mode: "0644"
  become: yes
  notify: restart nginx
  tags:
    - nginx
