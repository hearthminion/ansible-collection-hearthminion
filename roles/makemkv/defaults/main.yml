---
# defaults file for makemkv
hearthminion_makemkv_packages:
  - build-essential
  - pkg-config
  - libc6-dev
  - libssl-dev
  - libexpat1-dev
  - libavcodec-dev
  - libgl1-mesa-dev
  - qtbase5-dev
  - zlib1g-dev

hearthminion_makemkv_user: ""
hearthminion_makemkv_group: "{{ hearthminion_makemkv_user }}"

hearthminion_makemkv_version: "1.18.1"
hearthminion_makemkv_src_file: "makemkv-oss-{{ hearthminion_makemkv_version }}.tar.gz"
hearthminion_makemkv_bin_file: "makemkv-bin-{{ hearthminion_makemkv_version }}.tar.gz"
hearthminion_makemkv_src_url: "http://www.makemkv.com/download/{{ hearthminion_makemkv_src_file }}"
hearthminion_makemkv_bin_url: "http://www.makemkv.com/download/{{ hearthminion_makemkv_bin_file }}"

hearthminion_makemkv_files:
  - source: "{{ hearthminion_makemkv_src_url }}"
    file: "{{ hearthminion_makemkv_src_file }}"
    build_dir: "makemkv_oss"
    build_cmds:
      - "./configure"
      - "make"
      - "make install"
  - source: "{{ hearthminion_makemkv_bin_url }}"
    file: "{{ hearthminion_makemkv_bin_file }}"
    build_dir: "makemkv_bin"
    build_cmds:
      - "make"
      - "make install"

hearthminion_makemkv_app_destination_dir: ""
hearthminion_makemkv_app_expert_mode: 1
hearthminion_makemkv_app_java: ""
hearthminion_makemkv_app_proxy: ""
hearthminion_makemkv_app_ccextractor: ""
hearthminion_makemkv_sdf_stop: ""
hearthminion_makemkv_app_key: ""
